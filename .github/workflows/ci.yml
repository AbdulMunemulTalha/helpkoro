name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helpkoro
          POSTGRES_PASSWORD: helpkoro
          POSTGRES_DB: helpkoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpkoro -d helpkoro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://helpkoro:helpkoro@localhost:5432/helpkoro

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Database migrations
        run: pnpm --filter @helpkoro/db migrate

      - name: Seed fixtures
        run: pnpm --filter @helpkoro/db seed

      - name: API integration tests (DB)
        run: pnpm --filter api test:e2e
